# cloudbuild.yaml
steps:
  # ================================================================
  # SETUP & VALIDATION
  # ================================================================

  # Validate environment and setup Artifact Registry
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup-environment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Starting backend API build pipeline..."
        echo "Project: ${PROJECT_ID}"
        echo "Build ID: ${BUILD_ID}"
        echo "Branch: ${BRANCH_NAME:-main}"
        
        # Verify Artifact Registry repository exists
        gcloud artifacts repositories describe avestoai-repo \
          --location=${_ARTIFACT_REGISTRY_LOCATION} || \
        gcloud artifacts repositories create avestoai-repo \
          --repository-format=docker \
          --location=${_ARTIFACT_REGISTRY_LOCATION} \
          --description="AvestoAI backend container images"

  # ================================================================
  # BACKEND BUILD & PUSH
  # ================================================================

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend:latest'
      - '--cache-from'
      - '${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend:latest'
      - './backend'
    waitFor: ['setup-environment']

  # Push backend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', '${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend']
    waitFor: ['build-backend']

  # Build completion summary
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'build-summary'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "✅ Backend API build completed successfully!"
        echo "===========================================" 
        echo "Build ID: ${BUILD_ID}"
        echo "Commit SHA: ${SHORT_SHA}"
        echo ""
        echo "🏷️ Image Tags:"
        echo "  Latest: ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend:latest"
        echo "  SHA: ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${PROJECT_ID}/avestoai-repo/backend:${SHORT_SHA}"
        echo ""
        echo "📦 Image pushed to Artifact Registry successfully!"
    waitFor: ['push-backend']

# ================================================================
# SERVICE ACCOUNT
# ================================================================
serviceAccount: 'projects/avestoai-466417/serviceAccounts/my-ci-cd-sa@avestoai-466417.iam.gserviceaccount.com'

# ================================================================
# SUBSTITUTIONS
# ================================================================
substitutions:
  # Artifact Registry Configuration
  _ARTIFACT_REGISTRY_LOCATION: 'us-central1'

# ================================================================
# BUILD OPTIONS
# ================================================================
options:
  # Use high-CPU machine for faster builds
  machineType: 'E2_HIGHCPU_8'

  # Disk size for Docker builds
  diskSizeGb: 50

  # Logging configuration
  logging: 'CLOUD_LOGGING_ONLY'

  # Substitution option
  substitution_option: 'ALLOW_LOOSE'

# ================================================================
# TIMEOUT
# ================================================================
timeout: '900s' # 15 minutes

# ================================================================
# TAGS
# ================================================================
tags:
  - 'avestoai'
  - 'backend'
  - 'api'
  - 'build-${BUILD_ID}'
